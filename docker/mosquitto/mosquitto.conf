# Mosquitto — auth obligatoire
persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous false
password_file /mosquitto/config/passwd

# Listener Docker (réseau interne + Pi locaux)
listener 1883
protocol mqtt

# Pour activer TLS 8883, ajoutez certs dans storage/mosquitto/certs
# et décommentez le bloc ci-dessous (sinon Mosquitto refuse de démarrer) :
#
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
