# Mosquitto — auth obligatoire
persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous false
password_file /mosquitto/config/passwd

# 1883 — clair (réseau Docker interne + transition clients)
# Après migration MQTTS : retirez le mapping d'hôte 1883 dans compose (firewall).
listener 1883
protocol mqtt

# 8883 — MQTTS (TLS). Certs : storage/mosquitto/certs/
# Générer : ./docker/mosquitto/generate-certs.sh command.lha.run
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
