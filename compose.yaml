services:
  app:
    image: ${APP_IMAGE:-ghcr.io/fabienhamot/mcp_mqtt_server:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://led.example.com}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-led_display}
      DB_USERNAME: ${DB_USERNAME:-led}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CACHE_CONFIG: ${CACHE_CONFIG:-true}
      # Derrière Caddy (TLS terminé en amont)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - public_assets:/shared/public
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - led

  # Nginx interne uniquement — Caddy reverse-proxifie vers ce conteneur
  web:
    image: nginx:1.27-alpine
    container_name: led-display-web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - led
      - proxy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-led_display}
      POSTGRES_USER: ${DB_USERNAME:-led}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - led

  # MQTT : exposé sur l'hôte pour les Pi (pas via Caddy HTTP)
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PUBLIC_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./storage/mosquitto/certs:/mosquitto/certs:ro
    networks:
      - led

  mqtt-listener:
    image: ${APP_IMAGE:-ghcr.io/fabienhamot/mcp_mqtt_server:latest}
    restart: unless-stopped
    command: ["php", "artisan", "mqtt:listen-status"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      MQTT_HOST: mqtt
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    depends_on:
      - app
      - mqtt
      - db
    profiles:
      - listeners
    networks:
      - led

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  app_storage:
  app_logs:
  public_assets:

networks:
  led:
    driver: bridge
  # Réseau partagé avec le conteneur Caddy (docker network create proxy)
  proxy:
    external: true
